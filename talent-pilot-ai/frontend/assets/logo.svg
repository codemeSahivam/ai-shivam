      <stop offset="48%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="tp-sheen" x1="64" y1="20" x2="64" y2="108" gradientUnits="userSpaceOnUse">
