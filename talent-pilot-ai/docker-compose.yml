services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      ENVIRONMENT: development
      HTTPS_ONLY: "false"
      FRONTEND_DIR: /app/frontend
      TRUSTED_HOSTS: localhost,127.0.0.1
    volumes:
      - app-data:/app/backend/data
    restart: unless-stopped

volumes:
  app-data:
